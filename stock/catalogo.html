<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F284A">
<title>Catálogo · Pirí Diseño Láser</title>
<meta name="description" content="Termos, mates, vasos térmicos y regalos personalizados con grabado láser. Mirá lo que hay y pedí por WhatsApp.">
<meta property="og:title" content="Catálogo · Pirí Diseño Láser">
<meta property="og:description" content="Mirá lo que hay y pedí por WhatsApp.">
<meta property="og:image" content="https://fercaroyromi-hub.github.io/piri-ventas/stock/icon-512.png">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F284A;--navy2:#1B3B66;--gold:#C9A45C;--gold2:#E3C88E;--bg:#F4F5F8;--txt:#1C2433;--muted:#6B7689;--line:#E3E7EF;--wa:#25D366;--wa2:#128C4A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 26px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.35),transparent 70%)}
header img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
header h1{font-size:22px;margin-top:12px;font-weight:800}
header p{font-size:13px;opacity:.8;margin-top:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
.search{margin-top:-20px;position:relative;z-index:2}
.search input{width:100%;font:inherit;font-size:16px;padding:15px 16px 15px 46px;border:0;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,40,74,.12);outline:none}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(15,40,74,.07);display:flex;flex-direction:column;scroll-margin-top:16px;transition:box-shadow .3s}
.card.hl{box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(15,40,74,.15)}
.ph{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .sin{font-size:40px;opacity:.25}
.tag{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:#E8F6EF;color:#1E8E5A}
.tag.no{background:#F1F2F5;color:var(--muted)}
.inf{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.inf b{font-size:14px;line-height:1.3}
.pr{font-size:18px;font-weight:800;color:var(--navy)}
.pr.c{font-size:13px;color:var(--muted);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:5px}
.col{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:600}
.col i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.col.on{border-color:var(--navy);background:#EEF2F8}
.col.ag{opacity:.45;text-decoration:line-through}
.wa{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:12px;border:0;background:var(--wa);color:#fff;font-weight:700;font-size:13.5px}
.wa svg{width:18px;height:18px}
.vac{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
.sk{background:linear-gradient(90deg,#eceef2 25%,#f6f7f9 50%,#eceef2 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;aspect-ratio:.72}
@keyframes sk{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--wa);border:0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,211,102,.45);z-index:5}
.fab svg{width:30px;height:30px;color:#fff}
.bg{position:fixed;inset:0;background:rgba(5,12,25,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.bg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px}.sheet p{font-size:13px;color:var(--muted);margin-top:4px}
.sheet .wa{margin-top:12px;width:100%;padding:15px;font-size:15px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.zoom.on{display:flex}.zoom img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Pirí">
  <h1 id="tit">Pirí · Diseño Láser</h1>
  <p>Productos personalizados con grabado láser</p>
</header>
<div class="wrap">
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="¿Qué estás buscando?" oninput="pintar()"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="foot">¿No encontrás lo que buscás? Escribinos y lo hacemos a tu medida.</div>
</div>
<button class="fab" onclick="pedir()" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg></button>
<div class="bg" id="bg" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="sheet"></div></div>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img id="zimg" alt=""></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxCyZEmU8_eqwXoPPWfVz4u1X6NGV-yWTRwROb2FHJ4CwRFjvTXbIqe0Y_qQ9cz71YI/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = n => '$ ' + Math.round(n).toLocaleString('es-UY');
const foto = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
const COLS = { negro: '#1f1f1f', blanco: '#ffffff', rojo: '#d32f2f', azul: '#1e4fd8', celeste: '#5bb6f0', verde: '#2e9d57', rosa: '#f48fb1', fucsia: '#d81b80', violeta: '#7e57c2', lila: '#b39ddb', amarillo: '#fbc02d', naranja: '#f57c00', gris: '#9e9e9e', plateado: '#c0c0c0', plateada: '#c0c0c0', dorado: '#c9a45c', dorada: '#c9a45c', turquesa: '#26c6da', bordo: '#7b1f2b', beige: '#e8d9b5', marron: '#795548', crema: '#f3ead2' };
const colorCss = c => { const k = String(c || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); return COLS[k] || COLS[k.split(' ')[0]] || 'linear-gradient(135deg,#f6c,#6cf,#fc6)'; };
let D = { productos: [], whatsapp: [] }, grupos = [], cat = '', elegido = {};

function agrupar() {
  const g = {};
  D.productos.forEach(p => { const k = p.cat + '|' + p.nombre; (g[k] = g[k] || { nombre: p.nombre, cat: p.cat, items: [] }).items.push(p); });
  grupos = Object.values(g).map(x => {
    x.items.sort((a, b) => (b.disponible - a.disponible) || String(a.color).localeCompare(String(b.color)));
    x.disp = x.items.some(i => i.disponible);
    x.precios = [...new Set(x.items.map(i => i.precio).filter(v => v !== '' && v != null))];
    x.id = x.items[0].id;
    return x;
  }).sort((a, b) => (b.disp - a.disp) || a.cat.localeCompare(b.cat) || a.nombre.localeCompare(b.nombre));
}
function pintar() {
  const cats = [...new Set(grupos.map(g => g.cat))].sort();
  $('#chips').innerHTML = ['', ...cats].map(c => `<button class="${c === cat ? 'on' : ''}" onclick="cat='${esc(c)}';pintar()">${c ? esc(c) : 'Todo'}</button>`).join('');
  const q = $('#q').value.trim().toLowerCase();
  const L = grupos.filter(g => (!cat || g.cat === cat) && (!q || (g.nombre + ' ' + g.cat + ' ' + g.items.map(i => i.color).join(' ')).toLowerCase().includes(q)));
  if (!L.length) { $('#grid').innerHTML = '<div class="vac" style="grid-column:1/-1">No encontramos eso. ¡Escribinos y te ayudamos!</div>'; return; }
  $('#grid').innerHTML = L.map(g => {
    const sel = g.items.find(i => i.id === elegido[g.id]) || g.items.find(i => i.disponible) || g.items[0];
    const ft = sel.foto || (g.items.find(i => i.foto) || {}).foto;
    const precio = sel.precio !== '' && sel.precio != null ? sel.precio : g.precios[0];
    const cant = sel.stock != null && sel.disponible ? ` · quedan ${sel.stock}` : '';
    const hayColor = g.items.length > 1 || sel.color;
    return `<div class="card" data-ids=",${g.items.map(i => i.id).join(',')},">
      <div class="ph" onclick="${ft ? `zoom('${ft}')` : ''}">${ft ? `<img src="${foto(ft, 600)}" alt="${esc(g.nombre)}" loading="lazy">` : '<span class="sin">📦</span>'}
        <span class="tag ${sel.disponible ? '' : 'no'}">${sel.disponible ? 'Disponible' + cant : 'Agotado'}</span></div>
      <div class="inf"><b>${esc(g.nombre)}</b>
        ${precio != null ? `<div class="pr">${pesos(precio)}</div>` : '<div class="pr c">Consultar precio</div>'}
        ${hayColor ? `<div class="cols">${g.items.map(i => `<button class="col ${i.id === sel.id ? 'on' : ''} ${i.disponible ? '' : 'ag'}" onclick="elegido['${g.id}']='${i.id}';pintar()"><i style="background:${colorCss(i.color)}"></i>${esc(i.color || 'Único')}</button>`).join('')}</div>` : ''}
        <button class="wa" onclick="pedir('${sel.id}')">${ICON}${sel.disponible ? 'Lo quiero' : 'Consultar'}</button></div></div>`;
  }).join('');
}
const ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';
function mensaje(id) {
  const p = D.productos.find(x => x.id === id);
  if (!p) return '¡Hola! Vi el catálogo y quería hacer una consulta 😊';
  return `¡Hola! Vi en el catálogo: *${p.nombre}${p.color ? ' · ' + p.color : ''}*${p.precio ? ' (' + pesos(p.precio) + ')' : ''}.\n${p.disponible ? 'Me interesa, ¿cómo hago el pedido?' : '¿Cuándo vuelven a tener?'}`;
}
function pedir(id) {
  const txt = mensaje(id), W = D.whatsapp || [];
  if (W.length <= 1) return abrirWa(W[0] ? W[0].numero : '', txt);
  $('#sheet').innerHTML = `<h3>¿A quién le escribís?</h3><p>Cualquiera de los dos te atiende 😊</p>` +
    W.map(w => `<button class="wa" onclick="abrirWa('${w.numero}', decodeURIComponent('${encodeURIComponent(txt)}'))">${ICON}Escribirle a ${esc(w.nombre || '0' + w.numero.slice(3))}</button>`).join('');
  $('#bg').classList.add('on');
}
function abrirWa(n, txt) { $('#bg').classList.remove('on'); window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, '_blank'); }
function zoom(id) { $('#zimg').src = foto(id, 1200); $('#zoom').classList.add('on'); }
function resaltar() {
  const id = location.hash.slice(1); if (!id) return;
  const c = document.querySelector(`.card[data-ids*=",${CSS.escape(id)},"]`);
  if (c) {
    const g = grupos.find(x => x.items.some(i => i.id === id));
    if (g && elegido[g.id] !== id) { elegido[g.id] = id; pintar(); return resaltar(); }
    c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('hl'); setTimeout(() => c.classList.remove('hl'), 2500);
  }
}
async function cargar() {
  try {
    const c = localStorage.getItem('piri.cat'); if (c) { D = JSON.parse(c); agrupar(); pintar(); }
  } catch (e) {}
  try {
    const r = await fetch(API + '?c=1'); const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    D = j; try { localStorage.setItem('piri.cat', JSON.stringify(j)); } catch (e) {}
    if (j.nombre) { $('#tit').textContent = j.nombre; document.title = 'Catálogo · ' + j.nombre; }
    agrupar(); pintar(); resaltar();
  } catch (e) {
    if (!grupos.length) $('#grid').innerHTML = '<div class="vac" style="grid-column:1/-1">No pudimos cargar el catálogo. Revisá tu conexión y volvé a intentar.</div>';
  }
}
window.addEventListener('hashchange', resaltar);
cargar();
</script>
</body>
</html>
